name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Copy native plugin JS into www (for Export/Share)
        run: |
          mkdir -p www/capacitor-plugins
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/capacitor-plugins/filesystem.js
          cp node_modules/@capacitor/share/dist/plugin.js www/capacitor-plugins/share.js
          ls -la www/capacitor-plugins
      - name: Add or sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Print keystore fingerprint (debug check)
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep SHA1
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Print ACTUAL APK signing certificate (real check)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catatan-jualan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
